<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <h1>Maisie Bridge</h1>
    <span id="status" class="status disconnected">Disconnected</span>
  </div>

  <div class="field">
    <label for="bridgeUrl">Bridge URL</label>
    <input id="bridgeUrl" type="text" value="http://localhost:3001" spellcheck="false">
  </div>

  <div class="stats">
    <div class="stat">
      <span class="stat-label">Commands</span>
      <span id="commandCount" class="stat-value">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">Last Poll</span>
      <span id="lastPoll" class="stat-value">-</span>
    </div>
  </div>

  <div class="actions">
    <button id="toggleBtn" class="btn btn-primary">Start</button>
    <button id="resetBtn" class="btn btn-secondary">Reset Bridge</button>
  </div>

  <div id="error" class="error" hidden></div>

  <script src="popup.js"></script>
</body>
</html>
